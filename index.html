<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17101a">
<title>Premierenabend – das Geburtstagsquiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;700&family=Limelight&display=swap" rel="stylesheet">
<style>
:root{
  --night:#17101a; --night2:#251928; --velvet:#8d1b2d; --velvet2:#6a1222; --gold:#ffcf4a;
  --paper:#f3e6c8; --paper2:#e6d5ad; --ink:#2a1820; --mute:#6b5850; --ok:#23805e; --bad:#b8323f;
  --disp:'Limelight','Rockwell','Georgia',serif;
  --body:'Figtree','Segoe UI',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--night);color:var(--paper);font:400 17px/1.5 var(--body);
  padding:env(safe-area-inset-top,0px) 0 calc(92px + env(safe-area-inset-bottom,0px));min-height:100vh}
#app{max-width:560px;margin:0 auto;padding:0 16px}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid #4aa3ff;outline-offset:2px}
h1,h2,h3,p{margin:0}

/* Leuchtreklame */
.marquee{text-align:center;padding:10px 12px;margin:14px 0 8px;border-radius:6px;
  background:linear-gradient(#a2233a,var(--velvet2));box-shadow:0 0 0 2px #45091a,0 22px 44px -22px #ff3b5c99}
.marquee h1{font:400 clamp(30px,9.5vw,46px)/1.05 var(--disp);color:var(--gold);margin:10px 0 4px;text-shadow:0 0 20px #ffcf4a55}
.marquee p{font-size:14px;color:#ffe7ae;margin-bottom:10px}
.lights{height:8px;background:radial-gradient(circle,var(--gold) 0 3px,transparent 3.6px) 0 0/18px 8px repeat-x;animation:chase 1.3s steps(2) infinite}
@keyframes chase{50%{background-position:9px 0;opacity:.7}}
@media (prefers-reduced-motion:reduce){.lights{animation:none}}

.bar{display:flex;align-items:center;gap:10px;font-size:14px;padding:4px 2px;color:#d9c7b0}
.bar .me{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700;color:var(--paper)}
.bar .me i{font-weight:400;color:#d9c7b0}
.conn::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:#59d39b;margin-right:5px}
.conn.off::before{background:#ff6b6b}
.link{background:none;border:0;padding:6px 2px;color:inherit;text-decoration:underline;text-underline-offset:3px}

/* Eintrittskarte */
.ticket{background:var(--paper);color:var(--ink);border-radius:10px;padding:20px 18px;margin:14px 0;position:relative}
.ticket.has-stub{padding-top:0}
.stub{margin:0 -18px 18px;padding:12px 20px;border-bottom:2px dashed #b7a273;display:flex;justify-content:space-between;gap:12px;
  font-size:14px;color:var(--mute);position:relative}
.stub::before,.stub::after{content:"";position:absolute;bottom:-11px;width:20px;height:20px;border-radius:50%;background:var(--night)}
.stub::before{left:-10px}.stub::after{right:-10px}
.stub b{color:var(--velvet);white-space:nowrap}
.ticket h2{font:400 24px/1.2 var(--disp);margin-bottom:10px}
.ticket h3{font:700 17px/1.3 var(--body);margin:18px 0 8px}
.ticket .q{font:700 22px/1.28 var(--body);margin-bottom:6px;overflow-wrap:anywhere}
.ticket p{margin-bottom:10px}
.by,.note{font-size:14px;color:var(--mute)}
.err{color:var(--bad);font-weight:700;font-size:15px}
.tear{border-top:2px dashed #b7a273;margin:18px -18px}

label{display:block;font-weight:700;font-size:15px;margin:12px 0}
label .opt{font-weight:400;color:var(--mute)}
input[type=text],input[type=url],input[type=password],textarea{display:block;width:100%;margin-top:6px;padding:11px 12px;font-size:17px;font-weight:400;
  background:#fffaf0;border:2px solid var(--ink);border-radius:8px;color:var(--ink)}
textarea{resize:vertical;min-height:64px}

.btn{display:inline-block;border:0;border-radius:8px;background:var(--velvet);color:#fff3d6;font-weight:700;padding:13px 18px;min-height:48px}
.btn:active{background:var(--velvet2)}
.btn[disabled]{opacity:.4;cursor:default}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.btn.small{padding:8px 12px;min-height:38px;font-size:15px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.row .btn:first-child{flex:1}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px}
.chip{border:2px solid var(--ink);border-radius:999px;background:transparent;padding:9px 15px;font-weight:500;min-height:44px}
.chip.on{background:var(--ink);color:var(--gold)}

.opts{display:grid;gap:8px;margin:12px 0 4px}
.optb{display:flex;align-items:center;gap:12px;text-align:left;width:100%;border:2px solid var(--ink);border-radius:8px;background:transparent;padding:11px 12px;min-height:50px;font-weight:500;overflow-wrap:anywhere}
.optb .mk{flex:none;width:28px;height:28px;border:2px solid var(--ink);border-radius:50%;display:grid;place-items:center;font-size:14px;font-weight:700}
.optb.multi .mk{border-radius:6px}
.optb.on{background:var(--ink);color:var(--paper)}
.optb.on .mk{background:var(--gold);color:var(--ink);border-color:var(--gold)}
.optb.res{cursor:default}
.optb.good{border-color:var(--ok);background:#d5ecd9}
.optb.good .mk{background:var(--ok);border-color:var(--ok);color:#fff}
.optb.wrong{border-color:var(--bad);background:#f6d3d0}
.optb.wrong .mk{background:var(--bad);border-color:var(--bad);color:#fff}
.optb .pc{margin-left:auto;font-size:14px;color:var(--mute);white-space:nowrap;padding-left:8px}
.verdict{font:400 26px/1.1 var(--disp);margin-bottom:8px}
.verdict.y{color:var(--ok)}.verdict.n{color:var(--bad)}

.bars{list-style:none;padding:0;margin:12px 0}
.bars li{display:grid;grid-template-columns:minmax(84px,36%) 1fr 30px;gap:10px;align-items:center;padding:5px 0}
.bars li span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bars .track{height:14px;border-radius:7px;background:var(--paper2);overflow:hidden}
.bars .track i{display:block;height:100%;background:var(--velvet);border-radius:7px}
.bars b{text-align:right;font-variant-numeric:tabular-nums}
.bars li.mine span:first-child{font-weight:700}
.bars li.mine span:first-child::after{content:" (deine Wahl)";font-weight:400;color:var(--mute);font-size:13px}

.seg{display:flex;border:2px solid var(--ink);border-radius:8px;overflow:hidden;margin:6px 0 14px}
.seg button{flex:1;border:0;background:transparent;padding:10px 8px;font-weight:700;font-size:15px;min-height:44px}
.seg button.on{background:var(--ink);color:var(--gold)}
.seg button+button{border-left:2px solid var(--ink)}

.orow{display:flex;gap:8px;align-items:center;margin:8px 0}
.orow input{margin:0;flex:1;min-width:0}
.tick{flex:none;border:2px solid var(--ink);border-radius:8px;background:transparent;min-height:48px;padding:0 10px;font-size:14px;font-weight:700;color:var(--mute);min-width:86px}
.tick.on{background:var(--ok);border-color:var(--ok);color:#fff}
.x{flex:none;border:0;background:transparent;font-size:22px;width:36px;height:44px;color:var(--mute)}

.board{list-style:none;padding:0;margin:10px 0}
.board li{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:10px 8px;border-bottom:1px solid #cdbb91}
.board li:last-child{border-bottom:0}
.board .rk{font:400 20px/1 var(--disp);color:var(--velvet);text-align:center}
.board .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.board .nm small{display:block;font-weight:400;color:var(--mute);font-size:13px;overflow:hidden;text-overflow:ellipsis}
.board .pt{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.board .pt small{display:block;font-weight:400;color:var(--mute);font-size:13px}
.board li.me{background:#ffe9a8;border-radius:8px;border-bottom-color:transparent}

details{border-bottom:1px solid #cdbb91;padding:10px 0}
details:last-of-type{border-bottom:0}
summary{cursor:pointer;font-weight:700;overflow-wrap:anywhere}
summary small{display:block;font-weight:400;color:var(--mute);font-size:14px;margin-top:2px}
.plain{list-style:none;padding:0;margin:8px 0}
.plain li{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid #cdbb91;overflow-wrap:anywhere}
.plain li:last-child{border-bottom:0}
.plain li small{display:block;color:var(--mute);font-size:13px}
.inline{display:flex;gap:8px;align-items:center}
.inline input{margin:0;flex:1;min-width:0}
.qr{background:#fff;border-radius:10px;padding:10px;max-width:280px;margin:12px auto}
.qr svg{display:block;width:100%;height:auto}
.url{font-size:13px;overflow-wrap:anywhere;color:var(--mute);text-align:center}
.warn{background:#ffe1a6;border-radius:8px;padding:10px 12px;font-size:15px}

.tabs{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(5,1fr);background:var(--night2);
  border-top:2px solid #3a2a3d;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
.tabs button{position:relative;border:0;background:none;color:#cbb9c4;font-size:11.5px;font-weight:500;line-height:1.2;padding:6px 1px;min-height:56px;border-radius:8px}
.tabs button span{display:block;font-size:21px;margin-bottom:2px}
.tabs button.on{color:var(--gold);background:#35243a}
.tabs em{position:absolute;top:2px;left:calc(50% + 8px);font-style:normal;background:#e23d57;color:#fff;font-size:12px;font-weight:700;border-radius:999px;min-width:20px;padding:1px 6px}

#toast{position:fixed;left:50%;bottom:calc(104px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--gold);color:var(--ink);font-weight:700;
  padding:10px 16px;border-radius:8px;max-width:calc(100vw - 32px);box-shadow:0 8px 24px #0008;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9;text-align:center}
#toast.show{opacity:1}

.seg4{flex-wrap:wrap}
.seg4 button{flex:1 0 50%}
.seg4 button:nth-child(3){border-left:0}
.seg4 button:nth-child(n+3){border-top:2px solid var(--ink)}
.roles{list-style:none;padding:0;margin:8px 0}
.roles li{padding:8px;border-bottom:1px solid #cdbb91}
.roles li:last-child{border-bottom:0}
.roles li b{display:block}
.roles li span{font-size:14px;color:var(--mute)}
.roles li.cur{background:#ffe9a8;border-radius:8px;border-bottom-color:transparent}
.roles li.cur b::after{content:" (deine Rolle)";font-weight:400;font-size:13px;color:var(--mute)}
.ask{position:fixed;inset:0;background:#000c;z-index:30;display:grid;place-items:center;padding:20px}
.ask .ticket{max-width:420px;width:100%;margin:0}
/* Abspann */
.absbtn{display:block;width:100%;border:0;border-radius:10px;background:var(--night);color:var(--paper);padding:10px 14px 13px;margin:2px 0 14px;text-align:center;box-shadow:0 6px 16px -8px #000a}
.absbtn .lights{display:block;margin-bottom:9px}
.absbtn b{display:block;font:400 26px/1.1 var(--disp);color:var(--gold)}
.absbtn small{display:block;font-size:14px;color:#e9d9c4;margin-top:4px}
.absbtn.on{box-shadow:0 0 0 3px var(--velvet)}
.credits{background:var(--night);color:var(--paper);border-radius:10px;padding:14px 16px 16px;text-align:center;margin:4px 0 12px}
.credits .lights{margin:0 0 12px}
.credits .lights:last-child{margin:14px 0 0}
.credits p{margin:0}
.credits .cap{font-size:13px;color:#cbb9c4}
.credits .cph{width:120px;height:160px;object-fit:cover;border-radius:8px;margin:12px auto 0;display:block}
.credits .cname{font:400 clamp(28px,9vw,38px)/1.1 var(--disp);color:var(--gold);margin-top:12px;overflow-wrap:anywhere}
.credits .cchar{font-size:15px;margin:2px 0 14px}
.credits .crole{font:700 20px/1.2 var(--body);margin:2px 0 4px}
.credits dl{margin:14px 0 0;text-align:left;border-top:1px solid #4a3850}
.credits dt{font-size:13px;color:#cbb9c4;margin-top:10px}
.credits dd{margin:0;font-weight:700;overflow-wrap:anywhere}
.credits dd span{display:block}
/* Kostüm-Voting */
.btn.file{display:inline-block;margin:0;font-size:inherit;position:relative;overflow:hidden;text-align:center;cursor:pointer;line-height:22px}
.btn.file input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.btn.file:focus-within{outline:3px solid #4aa3ff;outline-offset:2px}
.btn.voted{background:var(--ink);color:var(--gold)}
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:18px 12px;margin-top:10px}
.ccard{min-width:0}
.ph{display:grid;place-items:center;width:100%;aspect-ratio:3/4;border:0;padding:0;border-radius:8px;overflow:hidden;background:var(--paper2);color:var(--mute);font-size:14px;text-align:center}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ccard .cn{font-weight:700;margin-top:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ccard small{display:block;color:var(--mute);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ccard .btn{width:100%;margin-top:8px}
.own{display:grid;grid-template-columns:112px 1fr;gap:14px;align-items:start}
.own .row{margin-top:10px}
.board .nm.wt{display:flex;gap:10px;align-items:center}
.board .nm.wt>span{min-width:0;overflow:hidden;text-overflow:ellipsis}
.thumb{width:44px;height:44px;border-radius:6px;object-fit:cover;background:var(--paper2);flex:none;display:block}
.zoom{position:fixed;inset:0;background:#000d;z-index:20;display:grid;place-items:center;padding:16px;border:0;width:100%;height:100%}
.zoom img{max-width:100%;max-height:100%;border-radius:8px}

/* Leinwand-Ansicht fürs Tablet */
.screen{padding:8px 0 24px}
.screen .qr{max-width:340px}
.screen .big{font:400 clamp(22px,3.2vw,34px)/1.2 var(--disp);color:var(--gold);text-align:center;margin:8px 0}
.screen .board li{padding:12px 10px;font-size:19px}
.screen .exit{display:block;margin:10px auto 0;color:#cbb9c4}
@media (min-width:860px){
  body.wide #app{max-width:1100px}
  .screen{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:start}
  .screen .exit{grid-column:1/-1}
}
</style>
</head>

<script>//---------------------------------------------------------------------

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        var b0 = bin.read();

        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);

      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);

  if (!D.meta || D.meta.auto !== false) list(D.players).forEach(p => add(p.name));
  const rest = out.slice(HOSTS.length).sort((a,b) => a.localeCompare(b, 'de'));
  return HOSTS.concat(rest);
}
const myName = () => (D.players && D.players[me] && D.players[me].name) || '';
const wwOpen = () => list(D.ww).filter(q => !(D.wwVotes && D.wwVotes[q.id] && D.wwVotes[q.id][me]));
const quizOpen = () => list(D.quiz).filter(q => q.by !== me && !(D.quizAns && D.quizAns[q.id] && D.quizAns[q.id][me]));
function nextOf(open, kind){
  let q = open.find(x => !ui.skip[x.id]);
  if (!q){ open.forEach(x => delete ui.skip[x.id]); q = open[0]; }
  if (ui.cur[kind] !== q.id){ ui.cur[kind] = q.id; if (kind === 'ww') ui.pick = null; else ui.sel = []; }
  return q;
}
function tally(qid){
  const v = (D.wwVotes && D.wwVotes[qid]) || {}, m = {};
  for (const pid in v){ const k = norm(v[pid]); if (!m[k]) m[k] = {name:v[pid], c:0}; m[k].c++; }
  const rows = Object.values(m).sort((a,b) => b.c - a.c || a.name.localeCompare(b.name, 'de'));
  return {rows, total:Object.keys(v).length, mine:v[me]};
}
function quizStat(qid){
  const a = (D.quizAns && D.quizAns[qid]) || {}, picks = {};
  let n = 0, ok = 0;
  for (const pid in a){ n++; if (a[pid].ok) ok++; arr(a[pid].s).forEach(i => { picks[i] = (picks[i] || 0) + 1; }); }
  return {n, ok, picks};
}
function board(){
  const P = D.players || {}, rows = {};
  for (const pid in P) rows[pid] = {pid, name:P[pid].name, char:P[pid].char, pts:0, n:0};
  const A = D.quizAns || {};
  for (const qid in A){
    if (!D.quiz || !D.quiz[qid]) continue;
    for (const pid in A[qid]){ const r = rows[pid]; if (!r) continue; r.n++; if (A[qid][pid].ok) r.pts++; }
  }
  const out = Object.values(rows).sort((a,b) => b.pts - a.pts || a.n - b.n || a.name.localeCompare(b.name, 'de'));
  out.forEach((r,i) => { r.rank = (i && out[i-1].pts === r.pts) ? out[i-1].rank : i + 1; });
  return out;
}

      if (!text){ ui.err = 'Die Frage fehlt noch.'; break; }
      const filled = d.opts.map((o,i) => ({o:o.trim(), c:d.correct.includes(i)})).filter(x => x.o);
      if (filled.length < 2){ ui.err = 'Trag mindestens zwei Antworten ein.'; break; }
      const correct = filled.map((x,i) => x.c ? i : -1).filter(i => i >= 0);
      if (!correct.length){ ui.err = 'Markiere, welche Antwort richtig ist.'; break; }
      if (!d.multi && correct.length > 1){ ui.err = 'Markiere genau eine richtige Antwort.'; break; }
      ui.draft = newDraft('quiz');
      toast(off ? 'Frage hinzugefügt. Du selbst bekommst sie nicht gestellt.' : 'Frage eingereicht – alle anderen können sie jetzt beantworten.');
      Store.write('quiz/' + uid('q'), Object.assign({text, opts:filled.map(x => x.o), correct, multi:!!d.multi}, base)); return;
    }
    case 'pin-set':
      if (ui.a.pin.trim().length < 4){ ui.err = 'Die PIN braucht mindestens 4 Zeichen.'; break; }
      ui.admin = true; SS.set('kq_admin', '1');
      { const h = hash(ui.a.pin.trim()); ui.a.pin = ''; Store.write('meta/pin', h); } return;
    case 'finale':
      if (!ui.admin) break;
      if (ds.v && !ok && ask('Abspann-Modus einschalten? Alle Gäste sehen dann nur noch ihren Abspann, das Spiel ist gesperrt.', a, ds)) return;
      toast(ds.v ? 'Abspann-Modus ist aktiv.' : 'Das Spiel ist wieder geöffnet.');
      window.scrollTo(0, 0);
      Store.write('meta/finale', ds.v ? true : null); return;
    case 'pin-change': {
      if (!ui.admin) break;
      const np = ui.a.pin2.trim();
      if (np.length < 4){ toast('Die neue PIN braucht mindestens 4 Zeichen.'); break; }
      ui.a.pin2 = ''; toast('Regie-PIN geändert.');
      Store.write('meta/pin', hash(np)); return;
    }
    case 'pin-enter':
      if (D.meta && hash(ui.a.pin.trim()) === D.meta.pin){ ui.admin = true; SS.set('kq_admin', '1'); ui.a.pin = ''; }
      else ui.err = 'Diese PIN stimmt nicht.';
      break;
    case 'admin-exit': ui.admin = false; SS.del('kq_admin'); ui.tab = 'ww'; break;
    case 'del-q':
      if (!ok && ask('Diese Frage mit allen Stimmen und Antworten löschen?', a, ds)) return;
      Store.write('', {[ds.kind + '/' + ds.id]: null, [(ds.kind === 'ww' ? 'wwVotes/' : 'quizAns/') + ds.id]: null}, true); return;
    case 'add-cand': {
      const n = ui.a.cand.trim().replace(/\s+/g, ' ');
      if (!n) break;
      ui.a.cand = '';
      if (candidates().some(c => norm(c) === norm(n)) && (!D.meta || D.meta.auto !== false)){ toast('Dieser Name steht schon zur Auswahl.'); break; }
      Store.write('cands/' + uid('c'), {name:n, t:Date.now()}); return;
    }
    case 'del-cand': Store.write('cands/' + ds.id, null); return;
    case 'auto': Store.write('meta/auto', !!ds.v); return;
    case 'del-player':
      if (!ok && ask('Diesen Gast entfernen? Er oder sie kann sich danach neu einwählen.', a, ds)) return;
      { const up = costumeRemoval(ds.id); up['players/' + ds.id] = null; up['costVotes/' + ds.id] = null;
        if (D.costumes && D.costumes[ds.id]) dropPhoto(ds.id);
        Store.write('', up, true); } return;
    case 'seed': {
      const up = {'meta/seeded': true}, now = Date.now(), name = myName();
      SEED_WW.forEach((t,i) => { up['ww/' + uid('w')] = {text:t, by:me, byName:name, off:true, t:now + i}; });
      SEED_QUIZ.forEach((q,i) => { up['quiz/' + uid('q')] = Object.assign({by:me, byName:name, off:true, t:now + i}, q); });
      toast('Beispielfragen geladen.');
      Store.write('', up, true); return;
    }
    case 'seed-quiz2': {
      const up = {'meta/seededQ2': true}, now = Date.now(), name = myName();
      SEED_QUIZ2.forEach((q,i) => { up['quiz/' + uid('q')] = Object.assign({by:me, byName:name, off:true, t:now + i}, q); });
      toast('20 Quizfragen geladen.');
      Store.write('', up, true); return;
    }
    case 'seed-bday': {
      const up = {'meta/seededB': true}, now = Date.now(), name = myName();
      SEED_BDAY.forEach((t,i) => { up['ww/' + uid('w')] = {text:t, by:me, byName:name, off:true, bday:true, t:now + i}; });
      toast('Geburtstagsrunde geladen.');
      Store.write('', up, true); return;
    }
    case 'reset-answers':
      if (!ok && ask('Alle Stimmen und Quizantworten löschen? Fragen, Gäste und Kostümfotos bleiben.', a, ds)) return;
      Store.write('', {wwVotes:null, quizAns:null, costVotes:null}, true); return;
    case 'reset-all':
      if (!ok && ask('Wirklich alles löschen? Fragen, Gäste, Kostümfotos, Stimmen und Antworten sind dann weg. Nur die Regie-PIN bleibt.', a, ds)) return;
      Store.delAllPhotos(); Object.keys(photos).forEach(k => { IDB.del(k); delete photos[k]; });
      Store.write('', {wwVotes:null, quizAns:null, ww:null, quiz:null, players:null, cands:null, costumes:null, costVotes:null, 'meta/seeded':null, 'meta/seededB':null, 'meta/seededQ2':null, 'meta/finale':null}, true); return;
    case 'screen': ui.view = 'screen'; window.scrollTo(0, 0); break;
    case 'screen-exit': ui.view = 'app'; break;
  }
  render();
}
document.addEventListener('click', e => { const el = e.target.closest('[data-act]'); if (el && !el.disabled) act(el.dataset.act, el.dataset); });
document.addEventListener('input', e => {
  const m = e.target.dataset && e.target.dataset.m; if (!m) return;
  const ps = m.split('.'); let o = ui;
  for (let i = 0; i < ps.length - 1; i++) o = o[ps[i]];
  o[ps[ps.length - 1]] = e.target.value;
});
document.addEventListener('change', e => {
  const t = e.target;
  if (!t.dataset || t.dataset.file !== 'costume' || !t.files || !t.files[0] || ui.up || isFinale()) return;
  const f = t.files[0];
  ui.err = ''; ui.up = true; render();
  shrink(f).then(d => Store.putPhoto(me, d).then(() => d)).then(d => {
    const ts = Date.now();
    setPhoto(me, ts, d); IDB.set(me, {t:ts, data:d});
    ui.up = false; toast('Foto hochgeladen.');
    Store.write('costumes/' + me, {t:ts});
  }).catch(err => {
    ui.up = false;
    ui.err = err && err.message === 'img' ? 'Dieses Bild lässt sich nicht lesen. Nimm ein Foto mit der Kamera auf oder wähle ein JPG.' : 'Das Foto wurde nicht hochgeladen, die Verbindung fehlt. Versuch es noch einmal.';
    render();
  });
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.dataset && e.target.dataset.enter){ e.preventDefault(); act(e.target.dataset.enter, e.target.dataset); }
});
document.addEventListener('focusout', () => { if (dirty) setTimeout(() => { if (dirty && !editing()) render(); }, 60); });
document.addEventListener('toggle', e => { const k = e.target.dataset && e.target.dataset.d; if (k) ui.open[k] = e.target.open; }, true);

/* ---------- Start ---------- */
(function start(){
  const m = /[#&]db=([^&]+)/.exec(location.hash || '');
  let cfg = HARDCODED_DB;
  if (!cfg && m){ try { cfg = decodeURIComponent(m[1]); } catch(e){} }
  if (cfg && cfg !== 'local' && !/^https:\/\/[a-z0-9.-]+\.(firebaseio\.com|firebasedatabase\.app)\/?$/i.test(cfg)) cfg = '';
  if (cfg) LS.set('kq_db', cfg); else cfg = LS.get('kq_db');
  if (cfg){ dbCfg = cfg; Store.init(cfg); }
  render();
})();
</script>
</body>
